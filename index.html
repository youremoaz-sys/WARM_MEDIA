<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WARM MEDIA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=Space+Grotesk:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loader"><div class="logo"><span class="w">W</span><span class="nm">ARM<small>MEDIA</small></span><img class="hm" src="hm-logo.svg" alt="HM" onerror="this.style.display='none'"></div></div>
<canvas id="globe"></canvas>
<img class="wm-mark" src="hm-logo.svg" alt="" aria-hidden="true" onerror="this.style.display='none'">

<header><div class="wrap bar">
<a class="logo" href="#top"><span class="w">W</span><span class="nm">ARM<small>MEDIA</small></span><img class="hm" src="hm-logo.svg" alt="HM" onerror="this.style.display='none'"></a>
<nav id="nav"></nav>
<button class="ib" id="lang" aria-label="Language">EN</button>
<button class="ib" id="gear" aria-label="Settings">⚙</button>
<button class="ib" id="account" aria-label="Account">♙</button>
</div></header>

<main id="top"><div class="wrap">
<div class="hero">
<div class="ticker" id="ticker"><span class="tag-b" data-t="brk"></span><span id="tk"></span></div>
<h1 data-t="h1"></h1><p data-t="sub"></p>
<div><a class="btn" href="#latest" data-t="cta"></a></div>
</div>
<section id="latest"><h2 data-t="latest"></h2><div id="news-tools"><input id="news-search" type="search" placeholder="ابحث في الأخبار"><select id="news-category"></select></div><div class="grid" id="g1"></div></section>
<section id="world"><h2 data-t="world"></h2><div class="grid" id="g2"></div></section>
<section id="comments"><h2 data-t="cm"></h2><select id="comment-article"></select>
<div class="cm-form"><input id="ci" data-ph="ph" maxlength="300"><button class="btn" id="cs" data-t="send"></button></div>
<div id="cl"></div></section>
</div></main>
<footer><div class="wrap"><div class="logo" style="font-size:.7rem;margin-bottom:10px"><span class="w">W</span><span class="nm">ARM<small>MEDIA</small></span></div><span data-t="ft"></span></div></footer>

<aside id="panel" aria-label="Settings">
<div class="row"><h2 style="margin:0" data-t="set"></h2><button class="ib" id="x">✕</button></div>
<div class="th" id="ths"></div>
<div class="row"><span data-t="c1"></span><input type="color" id="p1"></div>
<div class="row"><span data-t="c2"></span><input type="color" id="p2"></div>
<div class="row"><span data-t="d3"></span><input type="checkbox" id="t3" checked></div>
<div class="row"><span data-t="fx"></span><input type="checkbox" id="tf" checked></div>
<button class="btn" id="rs" style="width:100%;margin-top:10px" data-t="reset"></button>
</aside>
<div id="bnav"></div><div id="reader" hidden></div>
<div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
</body>
</html>
